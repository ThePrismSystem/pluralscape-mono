name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Check formatting
        run: pnpm format

      - name: Lint (zero warnings)
        run: pnpm lint

      - name: LOC ceilings (max-lines from repo root)
        run: pnpm lint:loc

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm typecheck

      - name: Types SoT parity gate
        run: pnpm types:check-sot

  test:
    name: Tests (coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: pluralscape_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      valkey:
        image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Run all tests with coverage
        env:
          TEST_VALKEY_PORT: "6379"
        run: pnpm test:coverage --reporter=default --reporter=junit --outputFile.junit=.junit/vitest.junit.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-integration
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: unit-integration
          directory: .junit
          fail_ci_if_error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  mobile-bundle:
    name: Mobile Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Check Expo SDK dependency versions
        run: pnpm --filter @pluralscape/mobile exec expo install --check

      - name: Bundle web, iOS, and Android
        run: pnpm --filter @pluralscape/mobile bundle

      - name: Upload bundle sizes to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          for platform in web ios android; do
            pnpm exec bundle-analyzer "apps/mobile/dist/_expo/static/js/${platform}" \
              --bundle-name="mobile-${platform}" \
              --upload-token="${CODECOV_TOKEN}"
          done

  migrations:
    name: Migration Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Generate migrations
        working-directory: packages/db
        run: |
          pnpm db:generate:pg
          pnpm db:generate:sqlite

      - name: Check for uncommitted migration changes
        run: |
          if [ -n "$(git diff --name-only packages/db/migrations/)" ]; then
            echo "::error::Migrations are out of date. Run 'pnpm db:generate:pg && pnpm db:generate:sqlite' in packages/db/ and commit the results."
            git diff packages/db/migrations/
            exit 1
          fi

      - name: Regenerate Crowdin glossary JSON schema
        run: |
          pnpm crowdin:schema
          pnpm exec prettier --write scripts/crowdin-glossary.schema.json

      - name: Check for uncommitted glossary-schema changes
        run: |
          if [ -n "$(git diff --name-only scripts/crowdin-glossary.schema.json)" ]; then
            echo "::error::scripts/crowdin-glossary.schema.json is out of date. Run 'pnpm crowdin:schema && pnpm format:fix scripts/crowdin-glossary.schema.json' and commit the result."
            git diff scripts/crowdin-glossary.schema.json
            exit 1
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate --ignore-registry-errors

  openapi:
    name: OpenAPI Spec Reconciliation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Check spec matches code routes
        run: pnpm openapi:check

  trpc-parity:
    name: tRPC Parity Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Check tRPC parity with REST
        run: pnpm trpc:parity

  scope-check:
    name: Scope Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Check scope coverage
        run: pnpm scope:check

  test-e2e:
    name: E2E Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: pluralscape_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Playwright browsers (mobile-web-e2e)
        run: pnpm --filter @pluralscape/mobile-web-e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pluralscape_e2e
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/.junit/e2e-api.junit.xml
        run: set -o pipefail && pnpm test:e2e | tee e2e-output.txt

      - name: Run slow E2E tests
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pluralscape_e2e
          E2E_WORKERS: "1"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/.junit/e2e-slow.junit.xml
        run: set -o pipefail && pnpm test:e2e:slow | tee e2e-slow-output.txt

      - name: Run SP import E2E tests
        run: set -o pipefail && pnpm test:e2e:sp-import --reporter=default --reporter=junit --outputFile.junit=.junit/e2e-sp-import.junit.xml | tee e2e-sp-import-output.txt

      - name: Run PK import E2E tests
        run: set -o pipefail && pnpm test:e2e:pk-import --reporter=default --reporter=junit --outputFile.junit=.junit/e2e-pk-import.junit.xml | tee e2e-pk-import-output.txt

      - name: Run mobile web E2E tests (OPFS driver)
        env:
          CI: "true"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/.junit/e2e-web.junit.xml
        run: set -o pipefail && pnpm test:e2e:web | tee e2e-web-output.txt

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: e2e
          directory: .junit
          fail_ci_if_error: true

      - name: Extract E2E test count
        if: github.ref == 'refs/heads/main'
        id: e2e-data
        run: |
          E2E_COUNT=$(grep -oP '\d+(?= passed)' e2e-output.txt | tail -1)
          SLOW_COUNT=$(grep -oP '\d+(?= passed)' e2e-slow-output.txt | tail -1)
          SP_COUNT=$(grep -oP '\d+(?= passed)' e2e-sp-import-output.txt | tail -1)
          PK_COUNT=$(grep -oP '\d+(?= passed)' e2e-pk-import-output.txt | tail -1)
          WEB_COUNT=$(grep -oP '\d+(?= passed)' e2e-web-output.txt | tail -1)
          TOTAL=$(( ${E2E_COUNT:-0} + ${SLOW_COUNT:-0} + ${SP_COUNT:-0} + ${PK_COUNT:-0} + ${WEB_COUNT:-0} ))
          echo "count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "message=${TOTAL} passed" >> "$GITHUB_OUTPUT"

      - name: Update E2E tests badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: b29472c169f6d431acf2b24a60a33225
          filename: e2e-tests.json
          label: E2E tests
          message: ${{ steps.e2e-data.outputs.message }}
          color: brightgreen
