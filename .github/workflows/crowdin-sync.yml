name: crowdin-sync

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/locales/en/**"
      - "crowdin.yml"
  schedule:
    # Daily at 06:00 UTC — pull the latest approved translations.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  push-sources:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Upload sources to Crowdin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2.17.1
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload source string context
        run: pnpm crowdin:upload-context
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GOOGLE_TRANSLATE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_TRANSLATE_SERVICE_ACCOUNT_JSON }}

      - name: Pre-translate new strings (TM + MT)
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GOOGLE_TRANSLATE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_TRANSLATE_SERVICE_ACCOUNT_JSON }}
        run: pnpm crowdin:pretranslate

  pull-translations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Pull translations from Crowdin
    runs-on: ubuntu-latest
    permissions:
      # The GitHub App token minted below carries its own permissions. These
      # workflow-level permissions apply only to the default GITHUB_TOKEN,
      # which we no longer use for git operations or PR creation.
      contents: read
    steps:
      # The `chore/crowdin-translations` branch is protected by a repo
      # ruleset that only the Pluralscape Crowdin Bot GitHub App may bypass.
      # Mint a fresh installation token per run for the API commit and the PR.
      - name: Mint Crowdin App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CROWDIN_APP_ID }}
          private-key: ${{ secrets.CROWDIN_APP_PRIVATE_KEY }}
          permission-contents: write # to update the translation branch
          permission-pull-requests: write # to open the PR and enable auto-merge

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Crowdin translation progress
        id: progress
        shell: bash
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          set -eo pipefail
          # crowdin/github-action exits non-zero when nothing is translated.
          # Skip the download step if all target languages sit at 0% so a
          # freshly-bootstrapped project doesn't red-line CI until the first
          # string is translated.
          response=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${CROWDIN_PERSONAL_TOKEN}" \
            "https://api.crowdin.com/api/v2/projects/${CROWDIN_PROJECT_ID}/languages/progress?limit=500")
          # Fallback to 0 when the language list is empty (freshly-created
          # project with no target languages) so jq does not divide by zero.
          translated=$(echo "${response}" | jq '[.data[]?.data.translationProgress] | if length == 0 then 0 else (add / length | floor) end')
          echo "Average translation progress across languages: ${translated}"
          if ! [[ "${translated}" =~ ^-?[0-9]+$ ]]; then
            {
              echo "## crowdin-sync: unexpected progress response"
              echo ""
              echo '```json'
              echo "${response}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Crowdin returned a non-numeric translation progress value; see step summary for the raw response."
            exit 1
          fi
          if [[ "${translated}" -gt 0 ]]; then
            echo "has_translations=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_translations=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No translations available yet; skipping download step."
          fi

      - name: Pull translations from Crowdin
        if: steps.progress.outputs.has_translations == 'true'
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2.17.1
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: false
          create_pull_request: false
          config: crowdin.yml
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - uses: ./.github/actions/setup-pnpm
        if: steps.progress.outputs.has_translations == 'true'

      # Main requires signed commits, and GitHub signs commits made through its API.
      - name: Commit translations through the GitHub API
        id: commit
        if: steps.progress.outputs.has_translations == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.sha }}
        run: pnpm crowdin:commit-translations

      - name: Open the translation PR and enable auto-merge
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Required checks on main hold the PR until CI passes. The ruleset on
          # chore/crowdin-translations limits pushes to this App, so only
          # Crowdin-originated commits land there.
          set -eo pipefail
          PR=$(gh pr list \
            --head chore/crowdin-translations \
            --state open \
            --json number \
            --jq '.[0].number')
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            PR=$(gh pr create \
              --base main \
              --head chore/crowdin-translations \
              --title "chore(i18n): daily Crowdin translation sync" \
              --label i18n \
              --body "Auto-generated by the daily Crowdin sync. GitHub merges this PR once the required checks pass. To block it, disable auto-merge on the PR.")
          fi
          gh pr merge "$PR" --auto --squash --delete-branch
          echo "::notice::Auto-merge enabled on $PR"
